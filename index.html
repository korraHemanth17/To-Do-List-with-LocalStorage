
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple task manager built with JavaScript and LocalStorage.">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="todo-container">
    <header>
      <h1>✓ My To-Do List</h1>
      <p>Organize your day, one task at a time.</p>
    </header>

    <form id="task-form">
      <label for="task-input" class="sr-only">New task</label>
      <input
        id="task-input"
        type="text"
        placeholder="Enter a new task..."
        maxlength="200"
        required
      >
      <button type="submit">Add Task</button>
    </form>

    <p id="task-count" aria-live="polite"></p>
    <ul id="task-list" aria-label="Tasks"></ul>

    <p class="footer">Your tasks are saved automatically!</p>
  </main>
</body>
</html>
